[package]
name = "fahras-shell-images"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Windows' own file icons and thumbnails, as File Explorer shows them"
publish = false

[lib]
name = "shell_images"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

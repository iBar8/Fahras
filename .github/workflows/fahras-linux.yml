name: Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  look:
    name: Build Fahras for Linux and check the look in English and Arabic
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install GTK 4 and the display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libgtk-4-dev libgtksourceview-5-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfontconfig-dev \
            libpoppler-glib-dev libwayland-dev libxkbcommon-dev librsvg2-common gstreamer1.0-plugins-base \
            xvfb xdotool imagemagick dbus python3-pil fonts-noto-core

      - name: Install the pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build
        run: cargo build --release --locked

      - name: Look check on a private display (English and Arabic)
        run: |
          Xvfb :77 -screen 0 1280x800x24 -nolisten tcp &
          sleep 2
          export DISPLAY=:77
          export DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --fork --print-address)"
          status=0
          for lang in en ar; do
            python3 .github/fahras/linux-look.py --app target/release/strata --evidence evidence --lang "$lang" || status=1
          done
          exit $status

      - name: Publish evidence to the ci-evidence-linux branch
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d evidence ] || exit 0
          cd evidence
          rm -rf home-* folder
          git init -q -b ci-evidence-linux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Linux look evidence for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-evidence-linux

  tests:
    name: Run the full Linux test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install GTK 4 and the display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libgtk-4-dev libgtksourceview-5-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfontconfig-dev \
            libpoppler-glib-dev libwayland-dev libxkbcommon-dev librsvg2-common \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good xvfb dbus at-spi2-core fonts-noto-core

      - name: Install the pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-tests-

      - name: Test on a private display and bus
        shell: bash
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: ./scripts/test-headless.py 2>&1 | tee test-output.txt

      - name: Summarize
        if: always()
        run: |
          grep -aE '^test .* \.\.\. FAILED$' test-output.txt | sort -u || true
          grep -aE '^test result: .* [0-9]{3,} passed' test-output.txt || true

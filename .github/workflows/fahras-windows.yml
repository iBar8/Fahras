name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Fahras for Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up MSYS2 with GTK 4
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            zip

      - name: Show toolchain
        run: |
          which rustc cargo gcc
          rustc --version
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build
        run: cargo build --release --locked

      - name: Package with the GTK runtime
        run: |
          set -euo pipefail
          out="dist/Fahras"
          mkdir -p "$out/bin" "$out/lib" "$out/share/glib-2.0"
          cp target/release/strata.exe "$out/bin/Fahras.exe"

          # Image loaders (SVG via librsvg) and their cache.
          cp -r /ucrt64/lib/gdk-pixbuf-2.0 "$out/lib/"

          # Every MinGW DLL the program and the loaders link against.
          deps() { ldd "$@" | awk '$3 ~ /^\/ucrt64\// { print $3 }'; }
          deps "$out/bin/Fahras.exe" "$out"/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll \
            | sort -u | xargs -I{} cp {} "$out/bin/"

          # Settings schemas, icons and source-view styles GTK loads at run time.
          cp -r /ucrt64/share/glib-2.0/schemas "$out/share/glib-2.0/"
          glib-compile-schemas "$out/share/glib-2.0/schemas"
          mkdir -p "$out/share/icons"
          cp -r /ucrt64/share/icons/hicolor /ucrt64/share/icons/Adwaita "$out/share/icons/"
          cp -r /ucrt64/share/gtksourceview-5 "$out/share/"
          cp branding/fahras.ico LICENSE THIRD_PARTY_LICENSES.md "$out/"

          (cd dist && zip -qr Fahras-windows-x64.zip Fahras)
          ls -la dist
          du -sh "$out"

      - name: Smoke test
        run: timeout 60 dist/Fahras/bin/Fahras.exe --version

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path (Join-Path (Split-Path $iscc) 'Languages\Arabic.isl'))) {
            choco upgrade innosetup -y --no-progress
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc /Qp "/DAppVersion=$version" "/DSourceDir=$PWD\dist\Fahras" "/DOutputDir=$PWD\dist\setup" packaging\fahras-windows\fahras.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist\setup | Format-Table Name, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Fahras-windows-x64
          path: dist/Fahras-windows-x64.zip
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Fahras-Setup-x64
          path: dist/setup/*.exe
          if-no-files-found: error

      - name: Desktop smoke test (window, drives, rename, copy, move, delete; English and Arabic)
        id: desktop
        shell: pwsh
        run: ./.github/fahras/windows-smoke.ps1 -App dist/Fahras -Evidence evidence

      - name: Publish smoke-test evidence to the ci-evidence branch
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not (Test-Path evidence)) { exit 0 }
          Set-Location evidence
          git init -q -b ci-evidence
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows smoke test evidence for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-evidence

  verify-download:
    name: Verify the installer and the zip on a fresh Windows machine
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the smoke test
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/fahras

      - name: Download the published artifact
        uses: actions/download-artifact@v4
        with:
          name: Fahras-windows-x64
          path: download

      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: Fahras-Setup-x64
          path: setup

      - name: Unzip it as a user would
        shell: pwsh
        run: |
          Expand-Archive -Path download/Fahras-windows-x64.zip -DestinationPath unpacked
          & unpacked/Fahras/bin/Fahras.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install for the current user
        shell: pwsh
        run: ./.github/fahras/windows-installer.ps1 -Setup (Get-ChildItem setup/*.exe)[0].FullName -Evidence evidence -Step install

      - name: Desktop smoke test on the installed copy
        shell: pwsh
        run: ./.github/fahras/windows-smoke.ps1 -App "$env:LOCALAPPDATA\Programs\Fahras" -Evidence evidence

      - name: Update the running installed copy
        shell: pwsh
        run: ./.github/fahras/windows-installer.ps1 -Setup (Get-ChildItem setup/*.exe)[0].FullName -Evidence evidence -Step update

      - name: Uninstall
        shell: pwsh
        run: ./.github/fahras/windows-installer.ps1 -Setup (Get-ChildItem setup/*.exe)[0].FullName -Evidence evidence -Step uninstall

      - name: Publish evidence to the ci-evidence-download branch
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not (Test-Path evidence)) { exit 0 }
          Set-Location evidence
          git init -q -b ci-evidence-download
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Installer and smoke test of the downloaded artifacts for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-evidence-download

  release:
    name: Sign the update and publish tagged releases
    if: github.event_name != 'pull_request'
    needs: [build, verify-download]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # Runs on every push, so a missing or wrong key shows up before a release.
      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.FAHRAS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          python3 .github/fahras/sign_release.py --directory assets --version "$version" --source-commit "$GITHUB_SHA"
          cat assets/strata-update-manifest.json

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          mv assets/Fahras-windows-x64.zip "assets/Fahras-$version-windows-x64.zip"
          (cd assets && sha256sum -- * > SHA256SUMS.txt)
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          # A release drafted on github.com already exists; attach the files to it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
              gh release edit "$TAG" --notes-file .github/fahras/release-notes.md
            fi
          else
            gh release create "$TAG" assets/* --title "Fahras $version" \
              --notes-file .github/fahras/release-notes.md "${prerelease[@]}"
          fi
